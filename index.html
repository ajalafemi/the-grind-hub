<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Grind Hub - No Wasted Potential</title>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:white;padding:20px;text-align:center}
input{width:90%;max-width:500px;padding:15px;border-radius:10px;border:none;margin:20px 0}
button{padding:15px 30px;background:#00ff88;color:black;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px auto;max-width:500px}
a{color:#00ff88}
</style>
</head>
<body>
<h1>🔥 THE GRIND HUB</h1>
<p>No Wasted Potential — Download Anything</p>
<p>YouTube | TikTok | Instagram | X | Facebook</p>

<input id="url" placeholder="Paste video link here..." />
<br>
<button onclick="extract()">GET DOWNLOAD LINKS</button>

<div id="result"></div>

<script>
async function extract(){
  const url = document.getElementById('url').value;
  const resDiv = document.getElementById('result');
  if(!url){ alert('Paste link first'); return; }
  resDiv.innerHTML = '⏳ Extracting... (Vercel may take 20s first time)';
  
  try {
    const res = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url})
    });
    const data = await res.json();
    if(data.error){ resDiv.innerHTML = 'Error: '+data.error; return; }
    
    let html = `<div class="card"><h3>${data.title}</h3><img src="${data.thumbnail}" width="100%"></div>`;
    data.formats.reverse().forEach(f=>{
      html += `<div class="card">${f.quality || f.ext} — ${f.ext} <br><a href="${f.url}" target="_blank" download>DIRECT DOWNLOAD</a></div>`;
    });
    resDiv.innerHTML = html;
  } catch(e){
    resDiv.innerHTML = 'Failed: '+e.message;
  }
}
</script>
</body>
</html>
